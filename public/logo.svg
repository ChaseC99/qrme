<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 100 100"
  width="1000"
  height="1000"
  style="background-color: #a8edfe;"
  role="img"
  aria-label="QR Me Icon"
>
  <style>
    .piece {
      fill: #191919;
      transform-box: fill-box;
      transform-origin: center;
    }

    .qr-frame {
      fill: none;
      stroke: #191919;
      stroke-width: 4;
    }

    .person {
      fill: #a8edfe;
      stroke: #191919;
      stroke-width: 3;
    }
  </style>

  <defs>
    <!-- Person head radius (14) plus 4 units of clearance. -->
    <mask id="head-clearance" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="white" />
      <circle cx="68" cy="46" r="18" />
    </mask>
  </defs>

  <g id="qr-contact-symbol">
    <!-- Top-left QR marker -->
    <g id="top-left-marker">
      <rect id="top-left-frame" class="piece qr-frame" x="9.5" y="8.5" width="24" height="24" rx="3.5" />
      <rect id="top-left-center" class="piece" x="16" y="15" width="11" height="11" rx="1.5" />
    </g>

    <!-- Bottom-left QR marker -->
    <g id="bottom-left-marker">
      <rect id="bottom-left-frame" class="piece qr-frame" x="9.5" y="63.5" width="24" height="24" rx="3.5" />
      <rect id="bottom-left-center" class="piece" x="16" y="70" width="11" height="11" rx="1.5" />
    </g>

    <!-- Top-right QR marker -->
    <g id="top-right-marker">
      <rect
        id="top-right-frame"
        class="piece qr-frame"
        x="66.5"
        y="8.5"
        width="24"
        height="24"
        rx="3.5"
        mask="url(#head-clearance)"
      />
      <rect id="top-right-center" class="piece" x="73" y="15" width="11" height="11" rx="1.5" />
    </g>

    <!-- Small editable QR modules -->
    <g id="qr-modules">
      <rect id="module-top-left" class="piece" x="38" y="10" width="7" height="7" rx="1.5" />
      <rect id="module-top-middle" class="piece" x="47" y="20" width="7" height="7" rx="1.5" />
      <rect id="module-upper-middle-vertical" class="piece" x="54.5" y="7" width="7" height="14" rx="1.5" />

      <path
        id="module-middle-left-corner"
        class="piece"
        d="
          M 39.5 25.5
          H 43.5
          Q 45 25.5 45 27
          V 31
          Q 45 32.5 46.5 32.5
          H 50.5
          Q 52 32.5 52 34
          V 38
          Q 52 39.5 50.5 39.5
          H 39.5
          Q 38 39.5 38 38
          V 27
          Q 38 25.5 39.5 25.5
          Z
        "
      />

      <path
        id="module-center-connector"
        class="piece"
        d="
          M 9 42
          H 19.5
          Q 21 42 21 43.5
          V 47.5
          Q 21 49 22.5 49
          H 26.5
          Q 28 49 28 47.5
          V 43.5
          Q 28 42 29.5 42
          H 46.5
          Q 48 42 48 43.5
          V 47.5
          Q 48 49 46.5 49
          H 36.5
          Q 35 49 35 50.5
          V 54.5
          Q 35 56 33.5 56
          H 15.5
          Q 14 56 14 54.5
          V 50.5
          Q 14 49 12.5 49
          H 9
          Q 7.5 49 7.5 47.5
          V 43.5
          Q 7.5 42 9 42
          Z
        "
      />

      <rect id="module-middle-right" class="piece" x="45" y="55" width="7" height="7" rx="1.5" />
      <rect id="module-lower-middle" class="piece" x="38" y="62" width="7" height="7" rx="1.5" />
    </g>

    <!-- Person -->
    <g id="person">
      <circle id="person-head" class="piece person" cx="68" cy="46" r="14" />
      <path
        id="person-body"
        class="piece person"
        d="M 41 86 A 27 24 0 0 1 95 86 V 92 Q 95 94 93 94 H 43 Q 41 94 41 92 Z"
      />
    </g>
  </g>
</svg>

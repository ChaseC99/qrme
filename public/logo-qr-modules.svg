<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 100 100"
  width="1000"
  height="1000"
  style="background-color: #a8edfe;"
  role="img"
  aria-label="QR Me Icon"
>
  <style>
    .piece {
      fill: #191919;
      transform-box: fill-box;
      transform-origin: center;
    }

    .qr-frame {
      fill: none;
      stroke: #191919;
      stroke-width: 4;
    }

    .person {
      fill: #a8edfe;
      stroke: #191919;
      stroke-width: 3;
    }
  </style>

  <defs>
    <!-- Clears the top-right finder frame around the transformed head. -->
    <mask id="head-clearance" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="white" />
      <circle cx="65.6" cy="41.2" r="18" fill="#000" />
    </mask>

    <!-- Keeps the small modules visually separate from the person. -->
    <mask id="person-clearance" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="white" />
      <g
        transform="translate(92 94) scale(1.1) translate(-92 -94)"
        fill="#000"
        stroke="#000"
        stroke-width="6"
      >
        <circle cx="68" cy="46" r="14" />
        <path d="M 43 86 A 25 25 0 0 1 93 86 V 92 Q 93 94 91 94 H 45 Q 43 94 43 92 Z" />
      </g>
    </mask>
  </defs>

  <g id="qr-contact-symbol">
    <g id="top-left-marker">
      <rect id="top-left-frame" class="piece qr-frame" x="9.5" y="8.5" width="24" height="24" rx="3.5" />
      <rect id="top-left-center" class="piece" x="16" y="15" width="11" height="11" rx="1.5" />
    </g>

    <g id="bottom-left-marker">
      <rect
        id="bottom-left-frame"
        class="piece qr-frame"
        x="9.5"
        y="63.5"
        width="24"
        height="24"
        rx="3.5"
      />
      <rect id="bottom-left-center" class="piece" x="16" y="70" width="11" height="11" rx="1.5" />
    </g>

    <g id="top-right-marker">
      <rect
        id="top-right-frame"
        class="piece qr-frame"
        x="66.5"
        y="8.5"
        width="24"
        height="24"
        rx="3.5"
        mask="url(#head-clearance)"
      />
      <rect id="top-right-center" class="piece" x="73" y="15" width="11" height="11" rx="1.5" />
    </g>

    <g id="qr-modules" mask="url(#person-clearance)">
      <path
        id="module-top-hook"
        class="piece"
        d="
          M 38.5 6.5 H 46.5 Q 48 6.5 48 8
          V 9 Q 48 10.5 46.5 10.5 H 45
          Q 43.5 10.5 43.5 12 V 14
          Q 43.5 15.5 42 15.5 H 38.5
          Q 37 15.5 37 14 V 8
          Q 37 6.5 38.5 6.5 Z
        "
      />

      <path
        id="module-top-connector"
        class="piece"
        d="
          M 57.5 6.5 H 60.5 Q 62 6.5 62 8
          V 11 Q 62 12.5 60.5 12.5 H 58
          Q 56.5 12.5 56.5 14 V 16
          Q 56.5 17.5 58 17.5 H 60.5
          Q 62 17.5 62 19 V 26.5
          Q 62 28 60.5 28 H 57.5
          Q 56 28 56 26.5 V 22.5
          Q 56 21 54.5 21 H 49.5
          Q 48 21 48 22.5 V 24.5
          Q 48 26 49.5 26 H 51
          Q 52.5 26 52.5 27.5 V 32
          Q 52.5 33.5 51 33.5 H 48
          Q 46.5 33.5 46.5 32 V 30.5
          Q 46.5 29 45 29 H 44
          Q 42.5 29 42.5 30.5 V 32
          Q 42.5 33.5 41 33.5 H 38.5
          Q 37 33.5 37 32 V 21.5
          Q 37 20 38.5 20 H 45.5
          Q 47 20 47 18.5 V 13.5
          Q 47 12 48.5 12 H 54.5
          Q 56 12 56 10.5 V 8
          Q 56 6.5 57.5 6.5 Z
        "
      />

      <rect id="module-middle-top-left" class="piece" x="27.3" y="37.2" width="6.6" height="6.2" rx="1.4" />
      <rect id="module-middle-top-right" class="piece" x="37.8" y="37.2" width="7.2" height="6.2" rx="1.4" />

      <path
        id="module-middle-left-connector"
        class="piece"
        d="
          M 11.5 37 H 21.5 Q 23 37 23 38.5
          V 40.5 Q 23 42 21.5 42 H 18.5
          Q 17 42 17 43.5 V 45.5
          Q 17 47 18.5 47 H 26.5
          Q 28 47 28 48.5 V 51
          Q 28 52.5 29.5 52.5 H 33
          Q 34.5 52.5 34.5 51 V 48.5
          Q 34.5 47 36 47 H 43.5
          Q 45 47 45 48.5 V 53
          Q 45 54.5 43.5 54.5 H 37.5
          Q 36 54.5 36 56 V 58.5
          Q 36 60 34.5 60 H 29
          Q 27.5 60 27.5 58.5 V 57
          Q 27.5 55.5 26 55.5 H 23
          Q 21.5 55.5 21.5 57 V 58.5
          Q 21.5 60 20 60 H 17.5
          Q 16 60 16 58.5 V 53
          Q 16 51.5 14.5 51.5 H 9.5
          Q 8 51.5 8 50 V 46.5
          Q 8 45 9.5 45 H 10
          V 38.5
          Q 10 37 11.5 37 Z
        "
      />

      <rect id="module-middle-left" class="piece" x="8" y="56" width="7" height="4" rx="1.4" />
      <rect id="module-middle-lower" class="piece" x="39" y="58.5" width="5" height="6" rx="1.2" />

      <!-- <path
        id="module-middle-right-connector"
        class="piece"
        d="
          M 85.5 37 H 91 Q 92.5 37 92.5 38.5
          V 54.5 Q 92.5 56 91 56 H 90
          Q 88.5 56 88.5 57.5
          Q 88.5 59 90 59 H 91
          Q 92.5 59 92.5 60.5 V 63.5
          Q 92.5 65 91 65 H 89.5
          Q 88 65 88 63.5
          Q 88 62 86.5 62 H 86
          Q 84.5 62 84.5 60.5 V 52
          Q 84.5 50.5 86 50.5 H 87
          Q 88.5 50.5 88.5 49 V 45.5
          Q 88.5 44 87 44 H 85.5
          Q 84 44 84 42.5 V 38.5
          Q 84 37 85.5 37 Z
        "
      /> -->
    </g>

    <g id="person" transform="translate(92 94) scale(1.1) translate(-92 -94)">
      <circle id="person-head" class="piece person" cx="68" cy="46" r="14" />
      <path
        id="person-body"
        class="piece person"
        d="M 43 86 A 25 25 0 0 1 93 86 V 92 Q 93 94 91 94 H 45 Q 43 94 43 92 Z"
      />
    </g>
  </g>
</svg>
